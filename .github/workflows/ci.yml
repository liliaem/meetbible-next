# Continuous Integration: runs on every pull request to main or dev,
# and again after each merge (push) to validate the merged result.
# Add the "lint-build-audit" check as required in the branch ruleset,
# so a PR can't be merged if any step fails.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege: this workflow can only read the repository
permissions:
  contents: read

jobs:
  quality:
    name: lint-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA (not a tag) so a moved or
      # hijacked tag can't change the code that runs here
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the GitHub token on disk

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Fails only on high or critical vulnerabilities
      # (moderate dev-tooling findings are accepted risk, see AS-001)
      - name: Dependency audit
        run: npm audit --audit-level=high
